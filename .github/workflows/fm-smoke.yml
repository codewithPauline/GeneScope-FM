name: Foundation model smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nucleotide-transformer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GeneScope AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ai]"
      - name: Run Nucleotide Transformer embedding smoke test
        run: |
          genescope embed examples/sequences.fasta \
            --model nucleotide-transformer \
            --batch-size 2 \
            --max-length 128 \
            --allow-remote-code --device cpu \
            --output /tmp/nt_embeddings.csv
          python - <<'PY'
          import json
          import pandas as pd

          frame = pd.read_csv("/tmp/nt_embeddings.csv")
          assert len(frame) == 3
          assert len([column for column in frame if column.startswith("embedding_")]) == 512

          with open("/tmp/nt_embeddings.csv.provenance.json", encoding="utf-8") as handle:
              provenance = json.load(handle)
          assert provenance["generation"]["backend"] == "nucleotide-transformer-v2"
          assert provenance["generation"]["pooling"] == "mean of final-layer attended non-special tokens"
          print(provenance)
          PY
      - name: Validate batching, pooling, truncation, export, and reporting
        run: python examples/validate_checkpoint.py --allow-remote-code --output /tmp/genescope-checkpoint
      - name: Preserve checkpoint validation results
        uses: actions/upload-artifact@v4
        with:
          name: nucleotide-transformer-validation
          path: /tmp/genescope-checkpoint
          retention-days: 30
