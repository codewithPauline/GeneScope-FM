name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check genescope tests examples
          ruff format --check genescope tests examples
      - name: Test
        run: pytest
      - name: Run offline demonstration
        run: |
          genescope baseline examples/synthetic/sequences.fasta --output /tmp/kmer_embeddings.csv
          genescope explore /tmp/kmer_embeddings.csv --metadata examples/synthetic/labels.csv --output /tmp/genescope-report
      - name: Build package
        run: pip wheel --no-deps . --wheel-dir /tmp/genescope-wheel

  optional-umap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional exploration dependencies
        run: pip install -e ".[dev,explore]"
      - name: Test UMAP with real dependency
        run: pytest tests/test_explore.py -k umap

  benchmark:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: pip install -e ".[dev,benchmark]"
      - name: Test held-out evaluation and data selection without downloads
        run: pytest tests/test_benchmark.py tests/test_benchmark_data.py

  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ai]"
      - name: Test real local encoder and masked-LM inference
        run: pytest tests/test_hf.py tests/test_model_registry.py tests/test_provenance.py
