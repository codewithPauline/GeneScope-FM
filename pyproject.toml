[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genescope-fm"
version = "0.3.1"
description = "AI-for-biology framework for exploring and benchmarking genomic foundation-model representations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Pauline Owusu-Ansah" }
]
keywords = [
  "genomics",
  "foundation-models",
  "bioinformatics",
  "artificial-intelligence",
  "representation-learning",
  "dna"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
benchmark = [
  "scikit-learn>=1.5,<1.9",
  "pyarrow>=15,<26",
]
explore = [
  "umap-learn>=0.5.6,<0.6",
]
ai = [
  "torch>=2.6,<3",
  "transformers==4.48.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
genescope = "genescope.cli:app"

[project.urls]
Repository = "https://github.com/codewithPauline/GeneScope-FM"
Issues = "https://github.com/codewithPauline/GeneScope-FM/issues"

[tool.hatch.build.targets.wheel]
packages = ["genescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]
